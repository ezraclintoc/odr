name: Release

# Full release: push a semver tag (e.g. v0.2.0) to build cross-platform
# binaries and publish a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: odr

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,   ext: "" }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,  ext: "", cross: true }
          - { os: macos-latest,   target: x86_64-apple-darwin,        ext: "" }
          - { os: macos-latest,   target: aarch64-apple-darwin,       ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (Linux aarch64)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked -p odr-cli --features vendored-tls --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked -p odr-cli --features vendored-tls --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="${BIN}-${{ github.ref_name }}-${{ matrix.target }}"
          staging="dist/$name"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${BIN}${{ matrix.ext }}" "$staging/"
          cp README.md LICENSE "$staging/"
          cp -r recipes "$staging/"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            (cd dist && 7z a "$name.zip" "$name")
            echo "ASSET=dist/$name.zip" >> "$GITHUB_ENV"
          else
            (cd dist && tar czf "$name.tar.gz" "$name")
            echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
