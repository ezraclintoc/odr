# FastPeopleSearch — free people-search site (TruePeopleSearch network).
id: fastpeoplesearch
name: FastPeopleSearch
homepage: https://www.fastpeoplesearch.com
tier: essential
recheck_days: 45
notes: >
  ODR locates your record automatically. Removal is usually immediate with no
  email confirmation. Search URL and selectors unverified as of 2026-07-21.
method: web_form
opt_out_url: https://www.fastpeoplesearch.com/removal
steps:
  - action: find_listing
    search_url: "https://www.fastpeoplesearch.com/name/{{first_name}}-{{last_name}}_{{city}}-{{state}}"
    result_selector: ".card"
    link_selector: "a.card-title"
    must_match:
      - "{{full_name}}"
      - "{{city}}"
  - action: navigate
    url: https://www.fastpeoplesearch.com/removal
  - action: fill
    selector: "input[name='url']"
    value: "{{listing_url}}"
  - action: human_step
    prompt: "Solve the CAPTCHA, then continue."
  - action: click
    selector: "button#removal-button"
  - action: wait_for
    selector: ".removal-success"
confirmation:
  kind: none
  note: "Removal usually applies within a few hours; re-check to confirm."
