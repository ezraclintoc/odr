# Nuwber — people-search broker. Web-form opt-out via your profile link.
id: nuwber
name: Nuwber
homepage: https://nuwber.com
tier: additional
recheck_days: 60
notes: >
  ODR locates your profile automatically and submits its link. Search URL and
  selectors unverified as of 2026-07-21.
method: web_form
opt_out_url: https://nuwber.com/removal/link
steps:
  - action: find_listing
    search_url: "https://nuwber.com/search?name={{first_name}}+{{last_name}}&state={{state}}"
    result_selector: ".search-result"
    link_selector: "a"
    must_match:
      - "{{full_name}}"
      - "{{city}}"
  - action: navigate
    url: https://nuwber.com/removal/link
  - action: fill
    selector: "input[name='url']"
    value: "{{listing_url}}"
  - action: fill
    selector: "input[name='email']"
    value: "{{email}}"
  - action: click
    selector: "button[type='submit']"
  - action: wait_for
    selector: ".confirmation"
confirmation:
  kind: email_link
  note: "Click the link Nuwber emails to {{email}}."
  expires_hours: 24
