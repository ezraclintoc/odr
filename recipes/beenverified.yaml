# BeenVerified — major people-search broker. Web-form opt-out + email confirm.
id: beenverified
name: BeenVerified
homepage: https://www.beenverified.com
tier: essential
recheck_days: 60
notes: >
  ODR locates your record on the opt-out search automatically; you only step in
  if the match is ambiguous. Search URL and selectors unverified as of
  2026-07-21.
method: web_form
opt_out_url: https://www.beenverified.com/app/optout/search
steps:
  - action: find_listing
    search_url: "https://www.beenverified.com/app/optout/search?fn={{first_name}}&ln={{last_name}}&state={{state}}"
    result_selector: ".person-search-result"
    link_selector: "a"
    must_match:
      - "{{full_name}}"
      - "{{city}}"
  - action: navigate
    url: "{{listing_url}}"
  - action: fill
    selector: "input[type='email']"
    value: "{{email}}"
  - action: human_step
    prompt: "Solve any CAPTCHA shown, then continue."
  - action: click
    selector: "button[type='submit']"
  - action: wait_for
    selector: ".optout-confirmation, .confirmation"
confirmation:
  kind: email_link
  note: "Click the confirmation link BeenVerified emails to {{email}}."
  expires_hours: 24
