# ClustrMaps — address/people-search broker. Web-form opt-out.
id: clustrmaps
name: ClustrMaps
homepage: https://clustrmaps.com
tier: additional
recheck_days: 60
notes: >
  ODR locates your listing automatically. Search URL and selectors unverified
  as of 2026-07-21.
method: web_form
opt_out_url: https://clustrmaps.com/bl/opt-out
steps:
  - action: find_listing
    search_url: "https://clustrmaps.com/persons/{{first_name}}-{{last_name}}"
    result_selector: ".person-item"
    link_selector: "a"
    must_match:
      - "{{full_name}}"
      - "{{city}}"
  - action: navigate
    url: https://clustrmaps.com/bl/opt-out
  - action: fill
    selector: "input[name='url']"
    value: "{{listing_url}}"
  - action: fill
    selector: "input[name='email']"
    value: "{{email}}"
  - action: human_step
    prompt: "Solve the CAPTCHA, then continue."
  - action: click
    selector: "button[type='submit']"
  - action: wait_for
    selector: ".confirmation"
confirmation:
  kind: email_link
  note: "Click the link ClustrMaps emails to {{email}}."
  expires_hours: 48
