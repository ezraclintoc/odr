# USPhoneBook — people-search / reverse-phone-lookup broker.
id: usphonebook
name: USPhoneBook
homepage: https://www.usphonebook.com
tier: additional
recheck_days: 60
notes: >
  ODR locates your record automatically and submits it. Search URL and
  selectors unverified as of 2026-07-21.
method: web_form
opt_out_url: https://www.usphonebook.com/opt-out
steps:
  - action: find_listing
    search_url: "https://www.usphonebook.com/{{first_name}}-{{last_name}}"
    result_selector: ".person-card"
    link_selector: "a"
    must_match:
      - "{{full_name}}"
      - "{{state}}"
  - action: navigate
    url: https://www.usphonebook.com/opt-out
  - action: fill
    selector: "input[name='url']"
    value: "{{listing_url}}"
  - action: fill
    selector: "input[name='email']"
    value: "{{email}}"
  - action: human_step
    prompt: "Solve the CAPTCHA, then continue."
  - action: click
    selector: "button[type='submit']"
  - action: wait_for
    selector: ".confirmation"
confirmation:
  kind: email_link
  note: "Click the link USPhoneBook emails to {{email}}."
  expires_hours: 24
