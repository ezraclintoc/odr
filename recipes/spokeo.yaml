# Spokeo — a high-traffic people-search broker. Web-form opt-out.
# Verified: 2026-07-20. If this breaks, the form selectors are the usual suspect.
id: spokeo
name: Spokeo
homepage: https://www.spokeo.com
tier: essential
recheck_days: 60
notes: >
  ODR finds your listing automatically and pastes its URL into the opt-out
  form. Spokeo emails a confirmation link that expires quickly.
method: web_form
opt_out_url: https://www.spokeo.com/optout
steps:
  - action: find_listing
    search_url: "https://www.spokeo.com/{{first_name}}-{{last_name}}/{{state}}/{{city}}"
    result_selector: ".search-result, .person-card"
    link_selector: "a"
    must_match:
      - "{{full_name}}"
      - "{{city}}"
  - action: navigate
    url: https://www.spokeo.com/optout
  - action: fill
    selector: "input[name='url']"
    value: "{{listing_url}}"
  - action: fill
    selector: "input[name='email']"
    value: "{{email}}"
  - action: human_step
    prompt: "Solve the CAPTCHA shown on the page, then continue."
  - action: click
    selector: "button[type='submit']"
  - action: wait_for
    selector: ".optout-confirmation"
confirmation:
  kind: email_link
  note: "Click the confirmation link Spokeo emails to {{email}}."
  expires_hours: 24
