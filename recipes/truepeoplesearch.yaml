# TruePeopleSearch — high-traffic free people-search site. Web-form opt-out.
id: truepeoplesearch
name: TruePeopleSearch
homepage: https://www.truepeoplesearch.com
tier: essential
recheck_days: 45
notes: >
  ODR finds your record automatically and pastes its URL into the removal form;
  it only asks you if the match is ambiguous. Search URL and selectors
  unverified as of 2026-07-21.
method: web_form
opt_out_url: https://www.truepeoplesearch.com/removal
steps:
  - action: find_listing
    search_url: "https://www.truepeoplesearch.com/results?name={{first_name}}+{{last_name}}&citystatezip={{city}},+{{state}}"
    result_selector: ".card-summary"
    link_selector: "a.detail-link"
    must_match:
      - "{{full_name}}"
      - "{{city}}"
  - action: navigate
    url: https://www.truepeoplesearch.com/removal
  - action: fill
    selector: "input[name='url']"
    value: "{{listing_url}}"
  - action: fill
    selector: "input[name='email']"
    value: "{{email}}"
  - action: human_step
    prompt: "Solve the CAPTCHA, then continue."
  - action: click
    selector: "button#submit-btn"
  - action: wait_for
    selector: ".confirmation"
confirmation:
  kind: email_link
  note: "Click the link TruePeopleSearch emails to {{email}}."
  expires_hours: 24
