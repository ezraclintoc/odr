[workspace]
resolver = "2"
members = [
    "crates/odr-recipes",
    "crates/odr-engine",
    "crates/odr-server",
    "crates/odr-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/odr-project/odr"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
odr-recipes = { path = "crates/odr-recipes" }
odr-engine = { path = "crates/odr-engine" }
odr-server = { path = "crates/odr-server" }

# Shared third-party
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
schemars = "0.8"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
